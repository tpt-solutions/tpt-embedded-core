version: 2
updates:
  # Keep Cargo dependencies up to date (esp-hal, proptest, heapless, etc.)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      esp-hal:
        patterns:
          - "esp-hal"
      testing:
        patterns:
          - "proptest"
          - "trybuild"
      heapless:
        patterns:
          - "heapless"

  # firmware/ is a separate Cargo workspace (own Cargo.toml/lock), not
  # covered by the root "/" entry above.
  - package-ecosystem: "cargo"
    directory: "/firmware"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # Each templates/* scaffold has its own standalone Cargo.toml (git deps,
  # not path deps, so it resolves independently of the root workspace) and
  # is likewise invisible to the root "/" entry.
  - package-ecosystem: "cargo"
    directory: "/templates/esp32-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "cargo"
    directory: "/templates/swarm-node-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
