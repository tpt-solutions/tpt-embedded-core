name: Kani

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  kani:
    name: Kani verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: model-checking/kani-github-action@v1
        with:
          args: cargo kani --workspace

  kani-crypto:
    name: Kani crypto verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: model-checking/kani-github-action@v1
        with:
          args: cargo kani --features mock -p tpt-e-cipher
      # Future: add side-channel analysis tooling here once real AES/ECC
      # implementations land (see todo.md Phase 3 formal verification item).
