[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2021"
publish = false
description = "ESP32 application scaffolded from tpt-embedded-core starter template"
authors = ["{{authors}}"]
license = "MIT OR Apache-2.0"

[dependencies]
# Interim: crates.io publishing hasn't happened yet (path deps need a
# `version` key added to every internal dependency first — see the root
# repo's CONTRIBUTING.md). A `git` dependency pinned to a rev makes this
# template buildable standalone (outside a clone of the monorepo), unlike
# `path = "../../crates/..."`, which only resolves from inside one. Switch
# these to plain version deps once the crates are published.
#
# IMPORTANT: this `rev` predates a round of fixes (constant-time ECC point
# arithmetic, a riscv32imc build break in tpt-e-chronos's mock clock, and
# this template's own main.rs not actually compiling — see the dated audit
# entry in the root todo.md). Bump it to the commit containing those fixes
# once pushed, before publicizing this template.
tpt-e-typestate-hal = { git = "https://github.com/tpt-solutions/tpt-embedded-core", rev = "570252d239101b1ab849618f61f3d805cfb67bc0", features = ["mock"] }
tpt-e-chronos = { git = "https://github.com/tpt-solutions/tpt-embedded-core", rev = "570252d239101b1ab849618f61f3d805cfb67bc0", features = ["mock"] }
tpt-e-cipher = { git = "https://github.com/tpt-solutions/tpt-embedded-core", rev = "570252d239101b1ab849618f61f3d805cfb67bc0", features = ["mock"] }

# Pin esp-hal to the version this template is known-good with. Replace with
# your target chip's feature as needed (esp32c3, esp32s3, esp32c6, esp32).
esp-hal = { version = "0.22", default-features = false, features = ["esp32c3"] }

critical-section = { version = "1" }

[features]
default = ["mock"]
mock = []

[[bin]]
name = "{{project-name}}"
path = "src/main.rs"
test = false
bench = false

[profile.release]
opt-level = "s"
