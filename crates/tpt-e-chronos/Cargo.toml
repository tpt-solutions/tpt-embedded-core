[package]
name = "tpt-e-chronos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WCET-bounded, zero-allocation telemetry ring buffer for ESP32"
repository.workspace = true

[lints]
workspace = true

[dependencies]
tpt-e-typestate-hal = { path = "../tpt-e-typestate-hal", optional = true }
critical-section = { version = "1" }

[dev-dependencies]
proptest = { workspace = true }
tpt-e-typestate-hal = { path = "../tpt-e-typestate-hal", features = ["mock"] }
# `std` gives host builds (tests/examples/doctests) a critical-section impl
# to link against. Real firmware builds get theirs from esp-hal (or
# whichever chip-support crate is linked in) instead — exactly one impl is
# selected per final binary via `critical_section::set_impl!`, and it's
# provided by whoever the *binary* depends on, not by this library crate.
critical-section = { version = "1", features = ["std"] }

[features]
default = []
mock = []

[[example]]
name = "ring_buffer_basics"
required-features = ["mock"]

[package.metadata.docs.rs]
features = ["mock"]
