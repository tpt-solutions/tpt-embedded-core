[package]
name = "tpt-e-typestate-hal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compile-time safe DMA & ISR abstractions for ESP32 family"
repository.workspace = true
readme = "../README.md"
homepage = "https://github.com/tpt-software/tpt-embedded-core"
documentation = "https://docs.rs/tpt-e-typestate-hal"
keywords = ["esp32", "dma", "typestate", "embedded", "no_std"]
categories = ["embedded", "no-std"]

[lints]
workspace = true

[dependencies]
esp-hal = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
trybuild = { workspace = true }

[features]
default = []
mock = []
use_esp_hal = ["esp-hal"]
# Per-chip feature forwarding to esp-hal, so CI's chip build matrix can
# actually select a target chip instead of building the same thing 4 times.
esp32 = ["esp-hal/esp32"]
esp32s3 = ["esp-hal/esp32s3"]
esp32c3 = ["esp-hal/esp32c3"]
esp32c6 = ["esp-hal/esp32c6"]
defmt = ["dep:defmt"]

[[example]]
name = "dma_transfer"
required-features = ["mock"]

[package.metadata.docs.rs]
features = ["mock"]
