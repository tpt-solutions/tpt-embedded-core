[package]
name = "tpt-e-cipher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Formally verified constant-time HW crypto wrappers (AES, SHA-256, ECC)"
repository.workspace = true
readme = "README.md"
homepage = "https://github.com/tpt-solutions/tpt-embedded-core"
documentation = "https://docs.rs/tpt-e-cipher"
keywords = ["esp32", "crypto", "aes", "sha256", "ecc", "constant-time", "embedded", "no_std"]
categories = ["cryptography", "embedded", "no-std"]

[lints]
workspace = true

[dependencies]

[dev-dependencies]
proptest = { workspace = true }
# Dev-only: exercises the Phase 3 exit-criteria integration test (DMA handle
# feeding a crypto operation). Not a production dependency of this crate.
tpt-e-typestate-hal = { path = "../tpt-e-typestate-hal", version = "0.1.0", features = ["mock"] }

[features]
default = []
mock = []

[[example]]
name = "hash_a_buffer"
required-features = ["mock"]

[[example]]
name = "verify_firmware_signature"
required-features = ["mock"]

[package.metadata.docs.rs]
features = ["mock"]
