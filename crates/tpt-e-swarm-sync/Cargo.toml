[package]
name = "tpt-e-swarm-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Verified state machine for mesh coordination on ESP32 swarms"
repository.workspace = true
readme = "../README.md"
homepage = "https://github.com/tpt-software/tpt-embedded-core"
documentation = "https://docs.rs/tpt-e-swarm-sync"
keywords = ["esp32", "mesh", "esp-now", "swarm", "embedded", "no_std"]
categories = ["embedded", "no-std"]

[lints]
workspace = true

[dependencies]
tpt-e-chronos = { path = "../tpt-e-chronos" }
# No longer mock-only: `mesh.rs`'s `MeshNode` uses a bounded `heapless::Vec`
# to track outstanding (unacknowledged) sent-message sequence numbers,
# unconditionally (not just under `mock`).
heapless = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tpt-e-chronos = { path = "../tpt-e-chronos", features = ["mock"] }
# tpt-e-chronos depends on critical-section unconditionally (2026-07-30 fix
# for the riscv32imc compile gap — see the root todo.md). Our own tests and
# examples link final binaries, which need a critical-section *impl*
# registered somewhere; on host that's the `std` feature's global-Mutex
# impl, same as tpt-e-chronos's own dev-dependency on itself.
critical-section = { version = "1", features = ["std"] }

[features]
default = []
mock = []

[[example]]
name = "mesh_election"
required-features = ["mock"]

[package.metadata.docs.rs]
features = ["mock"]
