[package]
name = "tpt-e-swarm-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Verified state machine for mesh coordination on ESP32 swarms"
repository.workspace = true

[lints]
workspace = true

[dependencies]
tpt-e-chronos = { path = "../tpt-e-chronos" }
heapless = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tpt-e-chronos = { path = "../tpt-e-chronos", features = ["mock"] }
heapless = { workspace = true }

[features]
default = []
mock = ["heapless"]

[[example]]
name = "mesh_election"
required-features = ["mock"]

[package.metadata.docs.rs]
features = ["mock"]
